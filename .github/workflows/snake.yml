name: Profile Figures

# Renders every generated image the profile README embeds and publishes them
# to the `output` branch: the live science figures (scripts/build_live.py)
# and the contribution snake. The live figures run first so an API failure
# stops the job before publishing, leaving the previous images online.

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "17 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Run on every push to the default branch
  push:
    branches:
      - main

concurrency:
  group: profile-figures
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the renderer scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render live figures (activity raster, language spectrum, project cards)
        run: python scripts/build_live.py --login "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake animation from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push the generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
